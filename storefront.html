<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Secure digital product checkout"><title>Product checkout · Autopilot</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"><style>body{min-height:100vh;background:radial-gradient(circle at 15% 10%,#30265b 0,transparent 35%),#0b0c14;color:#f7f5ff;display:grid;place-items:center;padding:24px}.store{width:min(620px,100%);padding:clamp(26px,6vw,54px);border:1px solid #ffffff20;border-radius:28px;background:#171725eF;box-shadow:0 30px 100px #0008}.store-brand{font:700 13px 'Space Grotesk';letter-spacing:.16em;color:#c9b8ff}.store h1{font:700 clamp(30px,7vw,48px) 'Space Grotesk';margin:30px 0 12px}.store p{color:#c5c2d4;line-height:1.7}.store button{width:100%;margin-top:26px}.store small{display:block;margin-top:18px;color:#9793aa}.store-status{min-height:24px;color:#f5c8a6}</style></head><body><main class="store"><div class="store-brand">✦ AUTOPILOT · SECURE CHECKOUT</div><h1 id="productName">Loading product…</h1><p id="productDescription">Retrieving product details.</p><div id="status" class="store-status" aria-live="polite"></div><button id="buy" class="primary" disabled>Continue to secure payment ↗</button><small>Payments are processed securely by Stripe. Your access is activated only after payment is verified.</small></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./storefront.js"></script></body></html>
